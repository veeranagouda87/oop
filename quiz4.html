<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz 4</title><link rel="stylesheet" href="../style.css"></head><body><header><b>☕ OOP Interactive V3</b><nav><a href="../index.html">Dashboard</a></nav></header><main><section class="hero"><div><small>QUIZ 4</small><h1>Module 4 Quiz</h1><p>Choose the correct answer.</p></div></section><section class="card q"><h3>1. Which concept is central to object-oriented programming?</h3><div class="choices"><button>Objects</button><button data-ok="1">Objects and classes</button><button>Only variables</button><button>Only loops</button></div><p class="r"></p></section><section class="card q"><h3>2. Java is primarily a...</h3><div class="choices"><button data-ok="1">Object-oriented language</button><button>Markup language</button><button>Database</button><button>Operating system</button></div><p class="r"></p></section><section class="card q"><h3>3. Which feature lets one interface have multiple implementations?</h3><div class="choices"><button data-ok="1">Polymorphism</button><button>Compilation</button><button>Comments</button><button>Packages</button></div><p class="r"></p></section><section class="card center"><h2 id="score">Score: 0 / 3</h2><a class="btn primary" href="../index.html">Dashboard</a></section></main><script>let score=0;document.querySelectorAll('.q').forEach(q=>q.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(q.dataset.done)return;q.dataset.done=1;if(b.dataset.ok){b.classList.add('ok');q.querySelector('.r').textContent='✅ Correct';score++}else{b.classList.add('bad');q.querySelector('.r').textContent='❌ Review the concept'}document.getElementById('score').textContent='Score: '+score+' / 3';localStorage.setItem('oopQuiz',String((+localStorage.getItem('oopQuiz')||0)+(b.dataset.ok?1:0)))}));</script></body></html>
